name: Backend Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "services/**"

jobs:
  test:
    name: Gradle test (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run backend tests
        run: ./services/gradlew test
