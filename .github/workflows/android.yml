name: Android

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontends/android-app/**"

jobs:
  build:
    name: Spotless check, unit tests, and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "Error: GOOGLE_SERVICES_JSON_BASE64 secret is not set or is empty."
            exit 1
          fi
      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" \
            | base64 --decode \
            > frontends/android-app/app/google-services.json
      - name: Run Spotless check
        run: >
          ./frontends/android-app/gradlew
          -p frontends/android-app
          :app:spotlessCheck
      - name: Run unit tests
        run: >
          ./frontends/android-app/gradlew
          -p frontends/android-app
          :app:testDebugUnitTest
      - name: Assemble debug APK
        run: >
          ./frontends/android-app/gradlew
          -p frontends/android-app
          :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: frontends/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
