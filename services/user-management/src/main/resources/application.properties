spring.application.name=user-management

# ─── Web config ───────────────────────────────────────────────────────────────
spring.mvc.apiversion.use.path-segment=1
spring.mvc.apiversion.default=1.0
spring.mvc.apiversion.supported=1.0

# ─── Datasource ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/zms_users
spring.datasource.username=zms_user
spring.datasource.password=zms_secret
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ─── JWT ──────────────────────────────────────────────────────────────────────
# Override in production via environment variable: JWT_SECRET
app.jwt.secret=${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars}
app.jwt.access-token-expiry-seconds=900
app.jwt.refresh-token-expiry-seconds=2592000

# ─── Cursor ───────────────────────────────────────────────────────────────────
# Must be set via environment variable: CURSOR_SECRET
# Rotating this value invalidates all in-flight page tokens (clients should restart from page 1)
app.cursor.secret=${CURSOR_SECRET}

# ─── Kafka ────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.cloudevents.kafka.CloudEventSerializer

# ─── Firebase ─────────────────────────────────────────────────────────────────
# Override in production via environment variables
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.firebase.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS:}

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.aspect.include-args=false

# ─── Consul ───────────────────────────────────────────────────────────────────
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s
spring.cloud.consul.config.enabled=true
spring.cloud.consul.config.prefix=config
spring.cloud.consul.config.format=yaml
spring.cloud.consul.config.watch.enabled=true
spring.config.import=optional:consul:

# ─── Valkey (Redis-compatible) ────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ─── gRPC Server ──────────────────────────────────────────────────────────────
spring.grpc.server.port=${GRPC_PORT:9090}
