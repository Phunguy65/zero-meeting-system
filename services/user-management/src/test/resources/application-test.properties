spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=integration-test-secret-key-must-be-at-least-32-chars
app.jwt.access-token-expiry-seconds=900
app.jwt.refresh-token-expiry-seconds=2592000

app.cursor.secret=test-cursor-secret-fixed-value-for-tests

# Disable Firebase auto-init in tests (beans are mocked via @MockitoBean)
app.firebase.project-id=
app.firebase.credentials-path=
