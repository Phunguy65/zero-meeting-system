spring.application.name=notification
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.threads.virtual.enabled=true
logging.aspect.include-args=false

app.notification.resend.api-key=${RESEND_API_KEY:}
app.notification.resend.from-email=${RESEND_FROM_EMAIL:notifications@example.com}
app.notification.resend.from-name=${RESEND_FROM_NAME:Zero Meeting System}
app.notification.invitation.join-base-url=${INVITATION_JOIN_BASE_URL:http://localhost:3000/join}
app.notification.kafka.invitation-consumer-group=${INVITATION_CONSUMER_GROUP:notification-meeting-invitations}
