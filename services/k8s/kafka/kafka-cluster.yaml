apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
    name: zms-kafka
    namespace: kafka
spec:
    kafka:
        version: 3.9.0
        # dev: 1 broker; prod: change to 3
        replicas: 1
        listeners:
            - name: plain
              port: 9092
              type: internal
              tls: false
            - name: tls
              port: 9093
              type: internal
              tls: true
        config:
            offsets.topic.replication.factor: 1
            transaction.state.log.replication.factor: 1
            transaction.state.log.min.isr: 1
            default.replication.factor: 1
            min.insync.replicas: 1
        # KRaft mode — no ZooKeeper
        storage:
            type: ephemeral
    # KRaft controller (replaces ZooKeeper)
    zookeeper:
        replicas: 0
    entityOperator:
        topicOperator: {}
        userOperator: {}
