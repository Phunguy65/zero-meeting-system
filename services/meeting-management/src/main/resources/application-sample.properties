# ─── Sample production configuration for meeting-management service ───────────
# Copy this file to application-prod.properties and fill in all required values.

# ─── Datasource ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://<DB_HOST>:5432/zms_meetings
spring.datasource.username=<DB_USER>
spring.datasource.password=<DB_PASSWORD>

# ─── Kafka ────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=<KAFKA_HOST>:9092

# ─── Valkey / Redis ───────────────────────────────────────────────────────────
spring.data.redis.host=<REDIS_HOST>
spring.data.redis.port=6379
spring.data.redis.password=<REDIS_PASSWORD>

# ─── LiveKit ──────────────────────────────────────────────────────────────────
app.livekit.url=https://<LIVEKIT_HOST>
app.livekit.ws-url=wss://<LIVEKIT_HOST>
app.livekit.api-key=<LIVEKIT_API_KEY>
app.livekit.api-secret=<LIVEKIT_API_SECRET>

# ─── Cursor ───────────────────────────────────────────────────────────────────
# Must be a random secret — generate with: openssl rand -hex 32
app.cursor.secret=<CURSOR_SECRET>

# ─── Invite Tokens ────────────────────────────────────────────────────────────
# HMAC-SHA256 signing key for invite tokens.
# REQUIRED in production: generate with: openssl rand -hex 32
# Rotation note: rotating this key invalidates all existing invite tokens. Hosts must resend invites.
zms.invite.token-secret=<INVITE_TOKEN_SECRET>

# Number of days a newly generated invite token remains valid (default: 7).
zms.invite.token-expiry-days=7

# Set to true once both meeting-management and notification services support token-based invites.
# Setting this to true removes rawPassword from Kafka events and invite emails.
zms.invite.use-tokens=true
