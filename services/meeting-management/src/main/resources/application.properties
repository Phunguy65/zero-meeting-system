spring.application.name=meeting-management
# ─── Web config ───────────────────────────────────────────────────────────────
spring.mvc.apiversion.use.path-segment=1
spring.mvc.apiversion.default=1.0
spring.mvc.apiversion.supported=1.0
# ─── Datasource ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/zms_meetings
spring.datasource.username=zms_user
spring.datasource.password=zms_secret
spring.datasource.driver-class-name=org.postgresql.Driver
# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# ─── Kafka ────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.cloudevents.kafka.CloudEventSerializer
# ─── Valkey (Redis-compatible) ────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# ─── LiveKit ──────────────────────────────────────────────────────────────────
app.livekit.url=${LIVEKIT_URL:http://localhost:7880}
app.livekit.ws-url=${LIVEKIT_WS_URL:ws://localhost:7880}
app.livekit.api-key=${LIVEKIT_API_KEY:zms-livekit-key}
app.livekit.api-secret=${LIVEKIT_API_SECRET:change-me-livekit-secret-must-be-at-least-32-chars}
app.livekit.webhook-url=${LIVEKIT_WEBHOOK_URL:http://localhost:8080/api/v1/webhook/livekit}
app.livekit.token-expiry-seconds=1800
app.livekit.recording.layout=${LIVEKIT_RECORDING_LAYOUT:speaker}
app.livekit.recording.bucket=${LIVEKIT_RECORDING_BUCKET:recordings}
app.livekit.recording.region=${LIVEKIT_RECORDING_REGION:us-east-1}
app.livekit.recording.endpoint=${LIVEKIT_RECORDING_ENDPOINT:http://localhost:9000}
app.livekit.recording.access-key=${LIVEKIT_RECORDING_ACCESS_KEY:rustfs-access-key}
app.livekit.recording.secret-key=${LIVEKIT_RECORDING_SECRET_KEY:rustfs-secret-key}
app.livekit.recording.force-path-style=${LIVEKIT_RECORDING_FORCE_PATH_STYLE:true}
app.livekit.recording.pending-max-age=${LIVEKIT_RECORDING_PENDING_MAX_AGE:PT7M}
# ─── Virtual Threads (Project Loom) ──────────────────────────────────────────
spring.threads.virtual.enabled=true
# ─── Logging ──────────────────────────────────────────────────────────────────
logging.aspect.include-args=false
# ─── gRPC Client — user-management ───────────────────────────────────────────
spring.grpc.client.channels.user-management.address=static://${USER_MANAGEMENT_GRPC_HOST:localhost}:${USER_MANAGEMENT_GRPC_PORT:9090}
spring.grpc.client.channels.user-management.negotiation-type=plaintext
# ─── SSE ─────────────────────────────────────────────────────────────────────
app.sse.timeout-ms=300000
app.sse.join-request-timeout-ms=600000

# ─── Cursor ──────────────────────────────────────────────────────────────────
# Must be set via environment variable: CURSOR_SECRET
app.cursor.secret=${CURSOR_SECRET}

# ─── Invite tokens ───────────────────────────────────────────────────────────
# IMPORTANT: Override zms.invite.token-secret via environment variable in production.
# Use a random 256-bit (32-byte) secret generated with a CSPRNG.
# Example: openssl rand -hex 32
zms.invite.token-secret=${ZMS_INVITE_TOKEN_SECRET:change-me-replace-in-production}
zms.invite.token-expiry-days=7
# Feature flag — set to true after both meeting-management and notification services are deployed.
zms.invite.use-tokens=false

# ─── OpenAPI / springdoc ──────────────────────────────────────────────────────
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false
springdoc.servers[0].url=${GATEWAY_URL:http://localhost:8080}
springdoc.servers[0].description=API Gateway
