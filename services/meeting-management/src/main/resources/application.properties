spring.application.name=meeting-management

# ─── Web config ───────────────────────────────────────────────────────────────
spring.mvc.apiversion.use.path-segment=1
spring.mvc.apiversion.default=1.0
spring.mvc.apiversion.supported=1.0

# ─── Datasource ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/zms_meetings
spring.datasource.username=zms_user
spring.datasource.password=zms_secret
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ─── Kafka ────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.cloudevents.kafka.CloudEventSerializer

# ─── Consul ───────────────────────────────────────────────────────────────────
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s
spring.cloud.consul.config.enabled=true
spring.cloud.consul.config.prefix=config
spring.cloud.consul.config.format=yaml
spring.cloud.consul.config.watch.enabled=true
spring.config.import=optional:consul:

# ─── Valkey (Redis-compatible) ────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ─── LiveKit ──────────────────────────────────────────────────────────────────
app.livekit.url=${LIVEKIT_URL:http://localhost:7880}
app.livekit.ws-url=${LIVEKIT_WS_URL:ws://localhost:7880}
app.livekit.api-key=${LIVEKIT_API_KEY:zms-livekit-key}
app.livekit.api-secret=${LIVEKIT_API_SECRET:change-me-livekit-secret-must-be-at-least-32-chars}
app.livekit.token-expiry-seconds=7200

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.aspect.include-args=false
